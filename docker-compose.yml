services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localtrak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localtrak
      POSTGRES_PASSWORD: localtrak
      POSTGRES_DB: localtrak_rotas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localtrak -d localtrak_rotas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
