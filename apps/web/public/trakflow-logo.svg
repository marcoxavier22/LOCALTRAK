<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 150">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#150B4F" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Círculo de movimento ao redor (Cyan Gradient) -->
  <path d="M 120 75 A 45 45 0 1 1 75 120" fill="none" stroke="url(#cyanGradient)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Seta verde indicando direção -->
  <path d="M 115 35 L 135 25 L 125 45 Z" fill="#A3E635"/>

  <!-- Ícone de localização (Roxo Gradient) -->
  <path d="M 75 25 C 50 25 35 45 35 65 C 35 95 75 130 75 130 C 75 130 115 95 115 65 C 115 45 100 25 75 25 Z" fill="url(#purpleGradient)"/>
  
  <!-- Estrada curva no centro -->
  <path d="M 75 125 C 65 100 85 80 75 65 C 65 50 75 45 75 45" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="4 4"/>

  <!-- Ponto interno da localização -->
  <circle cx="75" cy="55" r="12" fill="#22D3EE"/>

  <!-- Texto TRAKFLOW -->
  <text x="160" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="#150B4F">TRAKFLOW</text>
  
  <!-- Detalhe da seta verde final -->
  <path d="M 480 90 L 495 65 L 510 65 L 495 90 Z" fill="#A3E635"/>
</svg>
