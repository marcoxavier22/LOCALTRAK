services:
  - type: web
    name: localtrak-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Apenas o build da API — web está hospedada no Vercel separadamente.
    buildCommand: pnpm install && pnpm build:api
    preDeployCommand: pnpm prisma:migrate:deploy
    startCommand: pnpm start:api
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # CORS_ORIGINS: adicione todas as URLs de frontend separadas por virgula.
      # Nome tecnico legado mantido temporariamente para compatibilidade com servicos ativos.
      - key: CORS_ORIGINS
        value: https://localtrak-web.vercel.app,https://localtrak-mobile.vercel.app
      - key: SUPABASE_STORAGE_BUCKET
        value: order-odometer
      # Variaveis secretas — configurar manualmente no painel do Render:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MASTER_ADMIN_NAME
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
